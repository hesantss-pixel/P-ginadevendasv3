<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Maquete 3D ROTAV3 (gerador da imagem)</title><style>html,body{margin:0;background:#070d18}canvas{display:block;max-width:100%;height:auto}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const VIEW = q.get('view') || 'desk';
const W = +q.get('w') || (VIEW === 'mob' ? 2160 : 4800), H = +q.get('h') || (VIEW === 'mob' ? 2332 : 2042);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

// ---------- paleta ----------
const C = {
  slabTop: 0x16294a, slabSide: 0x0d1a31, block: 0x203d68, blockEdge: 0x1a3459,
  b1: 0xeef2f8, b2: 0xd5deeb, b3: 0xbccadf, roof: 0xf7f9fc,
  gold: 0xf2bf4b, goldDeep: 0xd99a1e, navy: 0x0e1f3a,
  entrega: 0x2ecc71, coleta: 0x3b82f6, urgente: 0xef4444, tree: 0x3d7a68, trunk: 0x6b5a48,
};
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.82, metalness: 0, ...o });

// ---------- grade ----------
const COLS = 4, ROWS = 3, B = 2.0, ST = 0.72, P = B + ST;
const WD = COLS * P + ST, DP = ROWS * P + ST;
const sx = (i) => -WD / 2 + ST / 2 + i * P;     // ruas verticais i = 0..COLS
const sz = (j) => -DP / 2 + ST / 2 + j * P;     // ruas horizontais j = 0..ROWS
const bc = (c, r) => [sx(c) + P / 2, sz(r) + P / 2]; // centro do quarteirão

let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

const root = new THREE.Group(); scene.add(root);
const add = (m, cast = true, recv = true) => { m.castShadow = cast; m.receiveShadow = recv; root.add(m); return m; };

// base (maquete)
const slab = add(new THREE.Mesh(new RoundedBoxGeometry(WD + 0.5, 0.7, DP + 0.5, 6, 0.28), [mat(C.slabSide), mat(C.slabSide), mat(C.slabTop), mat(C.slabSide), mat(C.slabSide), mat(C.slabSide)]));
slab.position.y = -0.35;
// faixas centrais das ruas (bem discretas)
const laneMat = mat(0x2a4570, { roughness: 0.9 });
for (let i = 0; i <= COLS; i++) for (let j = 0; j < ROWS; j++) {
  const m = add(new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.004, P * 0.36), laneMat), false, true);
  m.position.set(sx(i), 0.002, sz(j) + P / 2);
}
for (let j = 0; j <= ROWS; j++) for (let i = 0; i < COLS; i++) {
  const m = add(new THREE.Mesh(new THREE.BoxGeometry(P * 0.36, 0.004, 0.035), laneMat), false, true);
  m.position.set(sx(i) + P / 2, 0.002, sz(j));
}

// quarteirões
const blockGeo = new RoundedBoxGeometry(B, 0.14, B, 4, 0.06);
for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
  const [x, z] = bc(c, r);
  const m = add(new THREE.Mesh(blockGeo, mat(C.block)), false, true); m.position.set(x, 0.07, z);
}

// prédios
function winTex(base, win) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const x = cv.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, 64, 64);
  x.fillStyle = win; x.beginPath(); x.roundRect(16, 18, 32, 28, 5); x.fill();
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}
const PAL = [['#eef2f8', '#9fb3d1'], ['#dde5f0', '#93a8c8'], ['#c9d5e6', '#8399bb']];
const TEX = PAL.map(([b, w]) => winTex(b, w));
function building(x, z, w, d, h) {
  const k = Math.floor(rnd() * 3);
  const g = new RoundedBoxGeometry(w, h, d, 4, Math.min(0.08, w * 0.1));
  const floors = Math.max(2, Math.round(h / 0.3));
  const side = (span) => { const t = TEX[k].clone(); t.needsUpdate = true; t.repeat.set(Math.max(2, Math.round(span / 0.3)), floors); return mat(0xffffff, { map: t }); };
  const sx_ = side(d), sz_ = side(w), top = mat(PAL[k][0] === '#eef2f8' ? 0xf4f7fb : 0xe4ebf4);
  const m = add(new THREE.Mesh(g, [sx_, sx_, top, top, sz_, sz_])); m.position.set(x, 0.14 + h / 2, z);
  return m;
}
function tree(x, z, s = 1) {
  const t = add(new THREE.Mesh(new THREE.CylinderGeometry(0.035 * s, 0.045 * s, 0.22 * s, 10), mat(C.trunk))); t.position.set(x, 0.14 + 0.11 * s, z);
  const k = add(new THREE.Mesh(new THREE.SphereGeometry(0.2 * s, 24, 16), mat(C.tree, { roughness: 0.75 }))); k.position.set(x, 0.14 + 0.36 * s, z);
}
// layout fixo, pensado à mão (simples e equilibrado)
const L = {
  '1,0': [[-0.45, 0.35, 0.8, 0.7, 1.1], [0.5, -0.45, 0.7, 0.7, 0.7]],
  '2,0': [[-0.4, -0.4, 0.8, 0.8, 1.6], [0.45, 0.35, 0.7, 0.8, 0.9], [0.5, -0.5, 0.6, 0.6, 0.55]],
  '3,0': [[0, 0, 1.3, 1.1, 2.1]],
  '1,1': 'park',
  '2,1': [[-0.4, 0.3, 0.9, 0.9, 1.25], [0.45, -0.4, 0.7, 0.7, 0.8]],
  '3,1': [[0.35, -0.3, 0.8, 0.9, 1.4], [0.35, 0.6, 0.8, 0.5, 0.6]],
  '0,1': [[-0.35, -0.35, 0.8, 0.8, 0.9], [0.4, 0.35, 0.7, 0.7, 0.6]],
  '0,2': [[0, 0.1, 1.2, 1.0, 1.0]],
  '1,2': [[-0.4, -0.35, 0.8, 0.8, 1.3], [0.45, 0.4, 0.7, 0.6, 0.65]],
  '2,2': [[-0.35, -0.4, 0.9, 0.7, 0.85], [0.45, -0.35, 0.6, 0.7, 1.15]],
  '3,2': [[-0.3, 0, 0.9, 1.3, 0.75], [0.6, -0.5, 0.5, 0.5, 0.45]],
};
for (const [k, v] of Object.entries(L)) {
  const [c, r] = k.split(',').map(Number); const [x, z] = bc(c, r);
  if (v === 'park') {
    const pk = add(new THREE.Mesh(new RoundedBoxGeometry(B * 0.84, 0.05, B * 0.84, 3, 0.025), mat(0x2f6458, { roughness: 0.95 })), false, true); pk.position.set(x, 0.16, z);
    [[-0.45, -0.45, 1.5], [0.48, -0.4, 1.25], [-0.4, 0.5, 1.3], [0.45, 0.48, 1.55]].forEach(([a, b, s]) => tree(x + a, z + b, s));
  } else v.forEach(([a, b, w, d, h]) => building(x + a, z + b, w, d, h));
}

// depósito (quarteirão 0,0)
{
  const [x, z] = bc(0, 0);
  const g = new THREE.Group(); g.position.set(x, 0.14, z); root.add(g);
  const body = new THREE.Mesh(new RoundedBoxGeometry(1.7, 0.62, 1.15, 4, 0.06), mat(C.b1)); body.position.set(0, 0.31, -0.25);
  const roof = new THREE.Mesh(new RoundedBoxGeometry(1.78, 0.08, 1.22, 3, 0.03), mat(C.navy, { roughness: 0.6 })); roof.position.set(0, 0.66, -0.25);
  const band = new THREE.Mesh(new THREE.BoxGeometry(1.72, 0.07, 0.02), mat(C.gold, { roughness: 0.45, emissive: C.gold, emissiveIntensity: 0.08 })); band.position.set(0, 0.52, 0.335);
  g.add(body, roof, band);
  for (let i = -1; i <= 1; i++) { const d = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.3, 0.02), mat(0x23324a, { roughness: 0.5 })); d.position.set(i * 0.5, 0.17, 0.335); g.add(d); }
  const yard = new THREE.Mesh(new RoundedBoxGeometry(1.75, 0.02, 0.55, 2, 0.01), mat(0x2a4a78)); yard.position.set(0, 0.012, 0.66); g.add(yard);
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
}

// caminhão
function truck(color = C.b1) {
  const g = new THREE.Group();
  const box = new THREE.Mesh(new RoundedBoxGeometry(0.62, 0.36, 0.34, 4, 0.05), mat(color)); box.position.set(-0.09, 0.27, 0);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.05, 0.345), mat(C.gold, { roughness: 0.45 })); stripe.position.set(-0.09, 0.2, 0);
  const cab = new THREE.Mesh(new RoundedBoxGeometry(0.24, 0.28, 0.32, 4, 0.05), mat(C.navy, { roughness: 0.5 })); cab.position.set(0.3, 0.23, 0);
  const glass = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.1, 0.26), mat(0x9fc3ff, { roughness: 0.15, metalness: 0.2 })); glass.position.set(0.42, 0.29, 0);
  g.add(box, stripe, cab, glass);
  const wg = new THREE.CylinderGeometry(0.065, 0.065, 0.06, 18); wg.rotateX(Math.PI / 2);
  for (const [a, b] of [[-0.24, 0.16], [0.28, 0.16], [-0.24, -0.16], [0.28, -0.16]]) { const w = new THREE.Mesh(wg, mat(0x141a24, { roughness: 0.7 })); w.position.set(a, 0.07, b); g.add(w); }
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

// rota (tubo dourado arredondado pelas ruas)
const pts = [[sx(0) + 1.45, sz(1)], [sx(3), sz(1)], [sx(3), sz(3)], [sx(1), sz(3)], [sx(1), sz(2)]];
const Y = 0.05, Rc = 0.42;
const path = new THREE.CurvePath();
let prev = new THREE.Vector3(pts[0][0], Y, pts[0][1]);
for (let i = 1; i < pts.length; i++) {
  const a = new THREE.Vector3(pts[i - 1][0], Y, pts[i - 1][1]), b = new THREE.Vector3(pts[i][0], Y, pts[i][1]);
  if (i < pts.length - 1) {
    const c = new THREE.Vector3(pts[i + 1][0], Y, pts[i + 1][1]);
    const d1 = b.clone().sub(a).normalize(), d2 = c.clone().sub(b).normalize();
    const p1 = b.clone().addScaledVector(d1, -Rc), p2 = b.clone().addScaledVector(d2, Rc);
    path.add(new THREE.LineCurve3(prev, p1)); path.add(new THREE.QuadraticBezierCurve3(p1, b, p2)); prev = p2;
  } else path.add(new THREE.LineCurve3(prev, b));
}
const routeMat = mat(C.gold, { roughness: 0.38, metalness: 0.15, emissive: C.goldDeep, emissiveIntensity: 0.12 });
add(new THREE.Mesh(new THREE.TubeGeometry(path, 400, 0.075, 16, false), routeMat), true, false);
// pontas arredondadas
for (const p of [path.getPoint(0), path.getPoint(1)]) { const s = add(new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 12), routeMat)); s.position.copy(p); }

// alfinetes
function pin(x, z, color, h = 0.74) {
  const g = new THREE.Group(); g.position.set(x, 0, z);
  const m = mat(color, { roughness: 0.35, metalness: 0.05 });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 40, 28), m); head.position.y = h;
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 40, 1, true), m); cone.rotation.x = Math.PI; cone.position.y = h - 0.3;
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.105, 24, 16), mat(0xffffff, { roughness: 0.3 })); dot.position.set(0, h, 0);
  dot.userData.pinDot = true; dot.scale.set(1, 1, 0.35);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.26, 40), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.85, toneMapped: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.012;
  const base = new THREE.Mesh(new THREE.CircleGeometry(0.42, 40), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.18, toneMapped: false }));
  base.rotation.x = -Math.PI / 2; base.position.y = 0.01;
  [head, cone, dot].forEach((o) => { o.castShadow = true; });
  g.add(head, cone, dot, ring, base); root.add(g); return g;
}
const pins = [
  [sx(1) + P * 0.55, sz(1), C.entrega],
  [sx(3), sz(1) + P * 0.55, C.coleta],
  [sx(2) + P * 0.5, sz(3), C.entrega],
  [sx(1), sz(2) + 0.05, C.urgente],
];
pins.forEach(([x, z, c]) => pin(x, z, c).scale.setScalar(1.45));
// leva os anéis/alfinetes um pouco acima das ruas, sobre a rota
// caminhão no primeiro trecho
{ const t = truck(); t.scale.setScalar(1.5); t.position.set(sx(1) - 0.75, 0.0, sz(1)); root.add(t); }
{ const t = truck(); t.scale.setScalar(1.5); t.position.set(sx(3), 0.0, sz(2) + 0.55); t.rotation.y = -Math.PI / 2; root.add(t); }

// ---------- luz ----------
scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x0b1630, 0.55));
const key = new THREE.DirectionalLight(0xfff4e6, 2.4);
key.position.set(-7, 13, 8); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 7; key.shadow.blurSamples = 20; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 40 });
scene.add(key);
const rim = new THREE.DirectionalLight(0x9ec0ff, 0.6); rim.position.set(9, 6, -8); scene.add(rim);
// sombra do "bloco" na mesa invisível
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.45 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.72; floor.receiveShadow = true; scene.add(floor);

// ---------- câmera ----------
const cam = new THREE.PerspectiveCamera(VIEW === 'mob' ? 24 : 16, W / H, 1, 200);
const az = THREE.MathUtils.degToRad(+q.get('az') || (VIEW === 'mob' ? -45 : -32)), el = THREE.MathUtils.degToRad(+q.get('el') || (VIEW === 'mob' ? 54 : 44));
const dist = +q.get('d') || (VIEW === 'mob' ? 42 : 48);
const tgt = new THREE.Vector3(+q.get('tx') || (VIEW === 'mob' ? -1.2 : -0.2), +q.get('ty') || 0.35, +q.get('tz') || (VIEW === 'mob' ? 1.9 : 0.9));
cam.position.set(tgt.x + dist * Math.cos(el) * Math.sin(az), dist * Math.sin(el), tgt.z + dist * Math.cos(el) * Math.cos(az));
cam.lookAt(tgt);
// o "furo" branco do alfinete fica sempre de frente para a câmera
scene.updateMatrixWorld(true);
root.traverse((o) => {
  if (!o.userData.pinDot) return;
  const head = o.parent.localToWorld(new THREE.Vector3(0, o.position.y, 0));
  const dir = cam.position.clone().sub(head).normalize();
  const local = o.parent.worldToLocal(head.clone().addScaledVector(dir, 0.235 * o.parent.scale.x));
  o.position.copy(local); o.lookAt(cam.position);
});
renderer.render(scene, cam);
window.__done = true;
// link para baixar o PNG (fundo transparente)
const a = document.createElement('a');
a.textContent = 'Baixar PNG'; a.download = `cidade-maquete-${VIEW}.png`;
a.href = renderer.domElement.toDataURL('image/png');
a.style.cssText = 'position:fixed;left:12px;top:12px;padding:8px 12px;background:#f2bf4b;color:#111;font:600 14px system-ui;border-radius:8px;text-decoration:none';
document.body.appendChild(a);
</script></body></html>
